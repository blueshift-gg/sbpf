codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    # Report-only for now
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "src/main.rs" # CLI entrypoint
  - "src/commands" # CLI command plumbing
  - "xtask" # build/doc tooling
  - "examples" # example programs, not library code
  - "tests" # integration test harness
